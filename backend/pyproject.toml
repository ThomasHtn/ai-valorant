[project]
name = "valostats"
version = "0.1.0"
description = "Squad statistics from Valorant matches, served as a JSON API"
authors = [
    { name = "Thomas", email = "213429052+ThomasHtn@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
valostats = "valostats.cli:app"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Ambiguous characters: French text uses typographic apostrophes and the ellipsis.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Lambdas in loops are evaluated immediately inside the same iteration.
"src/valostats/analysis/**" = ["B023"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["valostats"]

[[tool.mypy.overrides]]
module = ["valostats.analysis.extraction.*", "valostats.analysis.session.costly_rounds"]
# Raw Henrik payloads are plain dicts.
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the PostgreSQL database with imported data"]

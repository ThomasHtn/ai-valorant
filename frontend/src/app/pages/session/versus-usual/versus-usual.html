<table class="data-table">
  <tr>
    <th>Joueur</th>
    @for (column of columns; track column.key) {
      <th class="num">{{ column.label }} <app-info-tip [topic]="column.key" /></th>
      <th class="num">vs habituel <app-info-tip topic="versusUsual" /></th>
    }
  </tr>
  @for (row of rows(); track row.name) {
    <tr>
      <td>{{ row.name }}</td>
      @for (column of columns; track column.key) {
        @let stat = row[column.key];
        @let change = delta(stat, column.kind);
        <td class="num">{{ value(stat, column.kind) }}</td>
        <td
          class="num font-semibold"
          [class.good]="change !== '=' && better(stat)"
          [class.bad]="change !== '=' && change !== '-' && !better(stat)"
          [class.average]="change === '='"
        >
          {{ change }}
        </td>
      }
    </tr>
  }
</table>

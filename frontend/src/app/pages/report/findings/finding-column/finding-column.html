<header
  class="flex items-center gap-3 border-b-2 bg-text-primary/8 px-4 py-2.5"
  [class]="weak() ? 'border-rating-bad' : 'border-rating-good'"
>
  <h2 class="!m-0 text-xl after:!hidden">{{ heading() }}</h2>
  <app-badge [label]="countLabel()" [kind]="weak() ? 'bad' : 'good'" size="sm" />
</header>

<div class="flex min-h-0 flex-1 flex-col overflow-y-auto overscroll-contain">
  @for (group of column().groups; track group.group) {
    <!-- Quiet divider: who the cards are about, then a hairline fading out. -->
    <h3
      class="!m-0 flex items-center gap-2 px-3 pt-4 pb-2 font-display text-base font-semibold text-text-primary"
    >
      <svg
        class="size-4 shrink-0"
        [class]="weak() ? 'text-rating-bad' : 'text-rating-good'"
        [lucideIcon]="group.group === 'team' ? teamIcon : playerIcon"
        aria-hidden="true"
      ></svg>
      {{ group.label }}
      <span class="font-sans text-sm font-normal text-text-muted">{{ group.subjects.length }}</span>
      <span
        class="h-px flex-1 bg-linear-to-r from-edge-strong to-transparent"
        aria-hidden="true"
      ></span>
    </h3>
    <div class="flex flex-col gap-2 px-2 pb-2">
      @for (subject of group.subjects; track subject.key) {
        <app-finding-card [subject]="subject" [playerAgents]="playerAgents()" />
      }
    </div>
  } @empty {
    <p class="!m-auto px-6 py-10 text-center text-text-muted">
      Aucun écart à afficher avec ces filtres.
    </p>
  }
</div>

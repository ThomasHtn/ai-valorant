<h2 [id]="headingId">
  {{ heading() }}
  <span class="order-2 font-sans text-sm font-normal text-text-muted">{{ countLabel() }}</span>
</h2>

<div class="flex flex-col gap-0.5">
  @for (subject of column().subjects; track subject.key) {
    <app-finding-card
      [subject]="subject"
      [scale]="column().scale"
      [playerAgents]="playerAgents()"
      [initiallyOpen]="subject.key === openKey()"
      [focused]="subject.key === openKey()"
    />
  } @empty {
    <p class="!m-0 bg-text-primary/4 px-4 py-6 text-center text-text-muted">
      {{
        weak()
          ? 'Aucun point faible net sur cette période.'
          : 'Aucun point fort net sur cette période.'
      }}
    </p>
  }
</div>

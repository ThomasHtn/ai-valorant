<section class="view-section" aria-labelledby="player-opening">
  <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
    <h3 id="player-opening" class="!m-0 font-display text-lg font-semibold text-text-primary">
      Premiers duels<app-info-tip topic="playerOpeningDuels" />
    </h3>
    <span class="ml-auto text-text-secondary">{{ duelsLine() }}</span>
  </div>
  <app-stat-bars [rows]="openingRows()" />
</section>

<section class="view-section" aria-labelledby="player-clutches">
  <h3 id="player-clutches" class="!m-0 font-display text-lg font-semibold text-text-primary">
    Clutchs<app-info-tip topic="playerClutches" />
  </h3>
  <app-stat-bars [rows]="clutchRows()" />
</section>

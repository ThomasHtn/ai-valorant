<!-- Who first: the picker is the view's main choice. -->
@if (players.hasValue()) {
  <app-player-picker [players]="players.value()" [selected]="selected()" />
}

<app-resource-state
  [resource]="players"
  notFoundText="Aucun joueur de l'escouade sur cette période."
>
  <app-resource-state
    [resource]="sheet"
    notFoundText="Ce joueur n'a pas joué avec l'escouade sur cette période."
  >
    @if (sheet.hasValue()) {
      @let p = sheet.value();
      @let display = state.preferences();
      <div class="view-body">
        <!-- Who the player is, then what his figures are measured against, right over them. -->
        <div class="flex flex-col gap-5">
          <app-player-header [sheet]="p" />
          <app-reading-bar [perRole]="true" />
        </div>

        <!-- His key figures once: their shape on the radar, their numbers beside it. -->
        <app-profile-radar
          [series]="radarSeries()"
          [reference]="display.reference"
          [colours]="display.colours"
          [split]="true"
        >
          <app-profile-figures
            [headline]="p.headline"
            [openingDuels]="p.openingDuels"
            [reference]="display.reference"
            [colours]="display.colours"
          />
        </app-profile-radar>

        <div class="grid items-start gap-x-10 gap-y-10 xl:grid-cols-2">
          <app-opening-clutch
            class="min-w-0"
            [openingDuels]="p.openingDuels"
            [clutches]="p.clutches"
            [reference]="display.reference"
            [colours]="display.colours"
          />
          <app-weapons-panel class="min-w-0" [weapons]="p.weapons" />
        </div>

        <!-- Tables take the full width so their columns never scroll sideways. -->
        @for (table of tables(); track table.id) {
          <section class="view-section" [attr.aria-labelledby]="'player-' + table.id">
            <h3
              class="font-display text-lg font-semibold text-text-primary"
              [id]="'player-' + table.id"
            >
              {{ table.title }}
            </h3>
            <app-stat-table
              [table]="table"
              [display]="display"
              [playerAgents]="context.playerAgents()"
            />
          </section>
        }

        <app-death-zones [deathZones]="p.deathZones" />

        <app-form-tiles
          [form]="p.form"
          [acs]="acs()"
          [reference]="display.reference"
          [colours]="display.colours"
        />
        @if (p.rewatch.length) {
          <app-rewatch-list [rounds]="p.rewatch" />
        }
      </div>
    }
  </app-resource-state>
</app-resource-state>

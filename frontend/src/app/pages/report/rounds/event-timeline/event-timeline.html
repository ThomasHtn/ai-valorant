<h2 class="!m-0 text-lg">Déroulé</h2>
<ol class="m-0 flex list-none flex-col gap-0.5 p-0">
  @for (line of lines(); track line.index) {
    @let active = line.index === step();
    <li>
      <button
        type="button"
        class="focus-ring-inset grid w-full cursor-pointer grid-cols-[3rem_4.2rem_minmax(0,1fr)_auto] items-center gap-2.5 border-l-[3px] px-2.5 py-1.5 text-left transition-colors hover:bg-text-primary/10"
        [class]="
          active ? 'border-brand-500 bg-text-primary/7' : 'border-transparent bg-text-primary/4'
        "
        [attr.aria-current]="active"
        (click)="stepChange.emit(line.index)"
      >
        <span class="text-text-secondary tabular-nums">{{ line.time }}</span>
        <span class="px-1 py-0.5 text-center text-xs font-semibold" [class]="line.tag.className">{{
          line.tag.label
        }}</span>
        <span>{{ line.text }}</span>
        <span class="flex items-center gap-1.5" [attr.aria-label]="line.state">
          @for (lit of line.own; track $index) {
            <i class="size-2 rounded-full" [class]="lit ? 'bg-squad' : 'bg-surface-600'"></i>
          }
          <b class="min-w-9 text-center font-display font-semibold" aria-hidden="true">{{
            line.state
          }}</b>
          @for (lit of line.opp; track $index) {
            <i class="size-2 rounded-full" [class]="lit ? 'bg-opponent' : 'bg-surface-600'"></i>
          }
        </span>
      </button>
    </li>
  }
</ol>

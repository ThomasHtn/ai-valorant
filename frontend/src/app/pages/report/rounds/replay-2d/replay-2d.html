<h2 class="!m-0 text-lg" id="replay-title">Replay 2D<app-info-tip topic="replay2d" /></h2>
<app-minimap-canvas class="max-w-104" [map]="map()" [markers]="markers()" />
<div class="flex max-w-104 items-center gap-2">
  <button
    type="button"
    class="focus-ring grid size-9 cursor-pointer place-items-center border border-edge-strong bg-text-primary/5 hover:bg-text-primary/9 disabled:cursor-default disabled:opacity-40"
    aria-label="Événement précédent"
    [disabled]="step() === 0"
    (click)="stepChange.emit(step() - 1)"
  >
    <svg class="size-4" lucideChevronLeft aria-hidden="true"></svg>
  </button>
  <input
    id="replay-step"
    type="range"
    class="flex-1 accent-brand-500"
    min="0"
    [max]="last()"
    [value]="step()"
    aria-label="Événement du round"
    (input)="onSlide($event)"
  />
  <button
    type="button"
    class="focus-ring grid size-9 cursor-pointer place-items-center border border-edge-strong bg-text-primary/5 hover:bg-text-primary/9 disabled:cursor-default disabled:opacity-40"
    aria-label="Événement suivant"
    [disabled]="step() >= last()"
    (click)="stepChange.emit(step() + 1)"
  >
    <svg class="size-4" lucideChevronRight aria-hidden="true"></svg>
  </button>
</div>
<p class="!m-0 flex flex-wrap items-center gap-x-4 gap-y-1 text-sm text-text-secondary">
  <span class="inline-flex items-center gap-1.5"
    ><i class="size-3 rounded-full bg-squad"></i>L'escouade</span
  >
  <span class="inline-flex items-center gap-1.5"
    ><i class="size-3 rounded-full bg-opponent"></i>Adversaires</span
  >
  <span class="text-text-muted">Positions connues seulement aux kills, plants et defuses</span>
</p>

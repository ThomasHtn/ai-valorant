<h2 class="!m-0 text-lg" id="round-causes-title">
  Pourquoi ces rounds sont perdus<app-info-tip topic="lossCause" />
  <span class="order-2 font-sans text-sm font-normal text-text-muted"
    >Clique une cause pour ne garder que ses rounds</span
  >
</h2>
<p class="!m-0 text-sm text-text-secondary">
  Chaque anneau : la part des {{ lost() }} rounds perdus qui finissent ainsi.
</p>
<!-- One ring per cause: the arc is its part of the lost rounds, the same scale for every cause. -->
<ul
  class="m-0 grid list-none grid-cols-[repeat(auto-fill,minmax(min(100%,13.5rem),1fr))] gap-0.5 p-0"
  aria-labelledby="round-causes-title"
>
  @for (item of rings(); track item.cause) {
    @let active = selected() === item.cause;
    <li>
      <button
        type="button"
        class="focus-ring-inset flex w-full cursor-pointer items-center gap-3 border-l-[3px] py-2 pr-3 pl-2.5 text-left transition-colors hover:bg-text-primary/10"
        [class]="
          active ? 'border-brand-500 bg-text-primary/7' : 'border-transparent bg-text-primary/4'
        "
        [attr.aria-pressed]="active"
        (click)="toggle(item.cause)"
      >
        <span class="relative grid size-12 shrink-0 place-items-center" aria-hidden="true">
          <svg viewBox="0 0 36 36" class="absolute inset-0 size-full -rotate-90">
            <circle
              cx="18"
              cy="18"
              [attr.r]="radius"
              fill="none"
              stroke-width="3.5"
              class="stroke-text-primary/10"
            />
            <circle
              cx="18"
              cy="18"
              [attr.r]="radius"
              fill="none"
              stroke-width="3.5"
              class="stroke-rating-bad"
              [attr.stroke-dasharray]="item.dash"
            />
          </svg>
          <span class="text-xs font-semibold tabular-nums">{{ item.percent }}</span>
        </span>
        <span class="flex min-w-0 flex-col leading-tight">
          <span class="truncate font-semibold">{{ item.label }}</span>
          <span class="text-sm text-text-muted">{{ item.rounds }}</span>
        </span>
      </button>
    </li>
  }
</ul>

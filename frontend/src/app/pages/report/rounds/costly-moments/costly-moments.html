<h2 class="!m-0 text-lg" id="costly-moments-title">Moments qui décident</h2>
<ul class="m-0 flex list-none flex-col gap-0.5 p-0" aria-labelledby="costly-moments-title">
  @for (moment of moments(); track moment.key) {
    <li>
      <button
        type="button"
        class="panel-option !grid grid-cols-[minmax(0,1fr)_auto] !gap-x-4 !gap-y-0 bg-text-primary/4 !px-3 !py-2"
        [attr.aria-pressed]="selected() === moment.key"
        (click)="picked.emit(moment.key)"
      >
        <span class="truncate">{{ moment.label }}</span>
        <span
          class="row-span-2 self-center text-right font-display text-xl font-medium tabular-nums"
          [class.text-rating-bad]="moment.bad"
          [class.text-text-primary]="!moment.bad"
          >{{ moment.figure }}</span
        >
        <span class="truncate text-sm font-normal text-text-muted">{{ moment.detail }}</span>
      </button>
    </li>
  }
</ul>

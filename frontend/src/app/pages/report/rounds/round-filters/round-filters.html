@let f = filters();
<label class="flex min-w-0 items-center gap-2">
  <span class="filter-label">Résultat</span>
  <select id="round-filter-result" class="field-control min-w-28" (change)="set('result', $event)">
    <option value="lost" [selected]="f.result === 'lost'">Rounds perdus</option>
    <option value="thrown" [selected]="f.result === 'thrown'">
      Throws (perdus à 70 % et plus)
    </option>
    <option value="won" [selected]="f.result === 'won'">Rounds gagnés</option>
    <option value="all" [selected]="f.result === 'all'">Tous</option>
  </select>
</label>
<label class="flex min-w-0 items-center gap-2">
  <span class="filter-label">Cause</span>
  <select id="round-filter-cause" class="field-control min-w-28" (change)="set('cause', $event)">
    <option value="" [selected]="!f.cause">Toutes</option>
    @for (cause of causes(); track cause) {
      <option [value]="cause" [selected]="f.cause === cause">{{ causeLabels[cause] }}</option>
    }
  </select>
</label>
<label class="flex min-w-0 items-center gap-2">
  <span class="filter-label">Carte</span>
  <select id="round-filter-map" class="field-control min-w-28" (change)="set('map', $event)">
    <option value="" [selected]="!f.map">Toutes</option>
    @for (map of maps(); track map) {
      <option [value]="map" [selected]="f.map === map">{{ map }}</option>
    }
  </select>
</label>
<label class="flex min-w-0 items-center gap-2">
  <span class="filter-label">Side</span>
  <select id="round-filter-side" class="field-control min-w-28" (change)="set('side', $event)">
    <option value="" [selected]="!f.side">Les deux</option>
    <option value="att" [selected]="f.side === 'att'">Attaque</option>
    <option value="def" [selected]="f.side === 'def'">Défense</option>
  </select>
</label>
<label class="flex min-w-0 items-center gap-2">
  <span class="filter-label">Achat</span>
  <select id="round-filter-buy" class="field-control min-w-28" (change)="set('buy', $event)">
    <option value="" [selected]="!f.buy">Tous</option>
    @for (buy of buys; track buy) {
      <option [value]="buy" [selected]="f.buy === buy">{{ buyLabels[buy] }}</option>
    }
  </select>
</label>

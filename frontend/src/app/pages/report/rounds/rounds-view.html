<!-- The way back sits with the filters, as close as they are to the list. -->
<div class="-mb-4 flex flex-col gap-2">
  @if (origin(); as o) {
    <a
      [routerLink]="o.link"
      class="focus-ring inline-flex items-center gap-1 self-start py-0.5 pr-1 text-sm !text-text-secondary no-underline hover:!text-text-primary"
    >
      <svg class="size-4" lucideChevronLeft aria-hidden="true"></svg>{{ o.label }}
    </a>
  }
  <div class="filter-strip" role="group" aria-label="Filtres des rounds">
    <app-round-filters
      [filters]="filters()"
      [maps]="mapOptions()"
      (filtersChange)="filters.set($event)"
    />
    @if (filters().match) {
      <app-scope-chip [label]="matchLabel()" (cleared)="setMatch('')" />
    }
    @if (query(); as q) {
      <app-scope-chip [label]="q.title" (cleared)="query.set(null)" />
    }
  </div>
</div>

<div class="grid items-start gap-x-10 gap-y-6 lg:grid-cols-[22rem_minmax(0,1fr)]">
  <nav class="flex min-w-0 flex-col gap-2" aria-label="Liste des rounds">
    <app-resource-state
      [resource]="index"
      notFoundText="Aucun round de l'escouade sur cette période."
    >
      @if (causes().length) {
        <app-round-causes
          class="mb-5"
          [causes]="causes()"
          [selected]="filters().cause"
          (selectedChange)="setCause($event)"
        />
      }
      <div class="flex items-center gap-2">
        <p class="!m-0 font-semibold">
          {{ rows().length }} <span class="font-normal text-text-muted">rounds</span>
        </p>
        <div class="ml-auto flex items-center gap-2" role="group" aria-label="Ordre de la liste">
          <span class="filter-label">Tri</span>
          <div class="seg-group">
            @for (option of sorts; track option.value) {
              <button
                type="button"
                class="seg-option"
                [attr.aria-pressed]="sort() === option.value"
                (click)="sort.set(option.value)"
              >
                {{ option.label }}
              </button>
            }
          </div>
        </div>
      </div>
      <app-round-list class="mt-1.5 block" [rounds]="rows()" [selected]="selected()" />
    </app-resource-state>
  </nav>

  @if (selected()) {
    <app-resource-state [resource]="sheet" notFoundText="Ce round est introuvable.">
      @if (sheet.hasValue()) {
        <app-round-sheet [sheet]="sheet.value()" />
      }
    </app-resource-state>
  } @else {
    <p class="bg-text-primary/4 px-4 py-6 text-center text-text-muted">Aucun round à afficher.</p>
  }
</div>

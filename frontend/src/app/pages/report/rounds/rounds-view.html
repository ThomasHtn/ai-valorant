@if (meta(); as meta) {
  <div class="flex flex-col gap-2">
    <app-filter-bar
      [maps]="maps()"
      [showPlayer]="false"
      [showReference]="false"
      [showToggles]="false"
    />
    <app-data-quality [meta]="meta" />
  </div>
}

<div class="mt-4 grid items-start gap-5 lg:grid-cols-[24rem_minmax(0,1fr)]">
  <nav class="flex min-w-0 flex-col gap-2.5" aria-label="Liste des rounds">
    @if (query(); as q) {
      <div
        class="flex items-center gap-2 border-l-2 border-brand-500 bg-brand-500/10 px-2.5 py-1.5 text-[0.95rem]"
      >
        <span>{{ q.title }}</span>
        <button
          type="button"
          class="focus-ring ml-auto cursor-pointer p-1 text-text-secondary hover:text-text-primary"
          aria-label="Retirer ce filtre"
          (click)="query.set(null)"
        >
          <svg class="size-4" lucideX aria-hidden="true"></svg>
        </button>
      </div>
    }
    <app-round-filters
      [filters]="filters()"
      [causes]="options().causes"
      [maps]="options().maps"
      (filtersChange)="filters.set($event)"
    />
    <app-resource-state
      [resource]="index"
      notFoundText="Aucun round de l'escouade sur cette période."
    >
      <p class="!m-0 text-[0.92rem] text-text-muted">{{ rows().length }} rounds</p>
      <app-round-list class="mt-1.5 block" [rounds]="rows()" [selected]="selected()" />
    </app-resource-state>
  </nav>

  @if (selected()) {
    <app-resource-state [resource]="sheet" notFoundText="Ce round est introuvable.">
      @if (sheet.hasValue()) {
        <app-round-sheet [sheet]="sheet.value()" />
      }
    </app-resource-state>
  } @else {
    <p class="bg-text-primary/4 px-4 py-6 text-center text-text-muted">Aucun round à afficher.</p>
  }
</div>

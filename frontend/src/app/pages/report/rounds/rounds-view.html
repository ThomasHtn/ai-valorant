<div class="filter-strip" role="group" aria-label="Filtres des rounds">
  <app-round-filters
    [filters]="filters()"
    [maps]="mapOptions()"
    (filtersChange)="filters.set($event)"
  />
  @if (filters().match) {
    <app-scope-chip [label]="matchLabel()" (cleared)="setMatch('')" />
  }
  @if (query(); as q) {
    <app-scope-chip [label]="q.title" (cleared)="query.set(null)" />
  }
</div>

<app-resource-state [resource]="index" notFoundText="Aucun round de l'escouade sur cette période.">
  @if (index.hasValue()) {
    <div class="flex flex-col gap-10">
      @if (causes().length) {
        <app-round-causes
          [causes]="causes()"
          [selected]="filters().cause"
          (selectedChange)="setCause($event)"
        />
      }

      <!-- Where rounds are lost, then when: both narrow the list below. -->
      <div class="grid items-start gap-x-10 gap-y-10 xl:grid-cols-[minmax(0,1.5fr)_minmax(0,1fr)]">
        <app-buy-matrix [rounds]="matrixRounds()" (picked)="pickCell($event)" />
        <app-costly-moments
          [rounds]="momentRounds()"
          [selected]="selectedMoment()"
          (picked)="pickMoment($event)"
        />
      </div>

      <section class="view-section scroll-mt-4" aria-labelledby="round-list-title">
        <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
          <h2 #listTitle class="!m-0 text-lg" id="round-list-title">{{ rows().length }} rounds</h2>
          <!-- Sorting by throw size only means something on lost rounds. -->
          @if (canSort()) {
            <div
              class="ml-auto flex items-center gap-2"
              role="group"
              aria-label="Ordre de la liste"
            >
              <span class="filter-label">Tri</span>
              <div class="seg-group">
                @for (option of sorts; track option.value) {
                  <button
                    type="button"
                    class="seg-option"
                    [attr.aria-pressed]="appliedSort() === option.value"
                    [appHoverTip]="{ title: option.label, text: option.hint }"
                    (click)="sort.set(option.value)"
                  >
                    {{ option.label }}
                  </button>
                }
              </div>
            </div>
          }
        </div>
        <app-round-list class="flex flex-col gap-3" [rounds]="rows()" />
      </section>
    </div>
  }
</app-resource-state>

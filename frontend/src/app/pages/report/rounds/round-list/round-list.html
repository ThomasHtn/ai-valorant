@if (lines().length) {
  <ul
    class="m-0 flex max-h-[28rem] min-h-0 flex-1 list-none flex-col gap-0.5 overflow-y-auto p-0 lg:max-h-none"
  >
    @for (line of lines(); track line.key) {
      <li>
        <a
          [routerLink]="line.link"
          queryParamsHandling="preserve"
          class="row-link grid grid-cols-[2rem_1fr_auto] items-center gap-x-2.5 gap-y-0.5 border-l-[3px] py-1.5 pr-2.5 pl-1.5"
          [class]="
            line.active
              ? 'border-brand-500 bg-text-primary/7'
              : 'border-transparent bg-text-primary/4'
          "
          [attr.aria-current]="line.active ? 'page' : null"
        >
          <app-map-thumb [map]="line.round.mapName" />
          <span class="font-semibold"
            >{{ line.title }} <span class="font-normal text-text-muted">{{ line.day }}</span></span
          >
          <span
            class="text-right text-sm font-semibold whitespace-nowrap"
            [class]="line.won ? 'text-rating-good' : 'text-rating-bad'"
            >{{ line.outcome }}</span
          >
          <span
            class="col-start-2 truncate text-sm text-text-muted"
            [class.col-end-4]="!line.chance"
            >{{ line.detail }}</span
          >
          @if (line.chance) {
            <span class="text-right text-sm whitespace-nowrap text-brand-400" [title]="throwTip">{{
              line.chance
            }}</span>
          }
        </a>
      </li>
    }
  </ul>
} @else {
  <p class="bg-text-primary/4 px-4 py-6 text-center text-text-muted">
    Aucun round avec ces filtres.
  </p>
}

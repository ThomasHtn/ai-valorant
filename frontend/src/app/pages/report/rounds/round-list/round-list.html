@if (lines().length) {
  <ul class="m-0 flex max-h-[70vh] list-none flex-col gap-0.5 overflow-y-auto p-0 scroll-subtle">
    @for (line of lines(); track line.key) {
      <li>
        <a
          [routerLink]="line.link"
          queryParamsHandling="preserve"
          class="focus-ring-inset grid grid-cols-[2rem_1fr_auto] items-center gap-x-2.5 gap-y-0.5 border-l-[3px] py-1.5 pr-2.5 pl-1.5 !text-text-primary no-underline transition-colors hover:bg-text-primary/7"
          [class]="
            line.active
              ? 'border-brand-500 bg-text-primary/7'
              : 'border-transparent bg-text-primary/4'
          "
          [attr.aria-current]="line.active ? 'page' : null"
        >
          <app-map-thumb [map]="line.round.mapName" />
          <span class="font-semibold"
            >{{ line.title }} <span class="font-normal text-text-muted">{{ line.day }}</span></span
          >
          <span
            class="font-display text-[0.95rem] font-semibold"
            [class]="line.round.won ? 'text-rating-good' : 'text-rating-bad'"
            title="Meilleure situation"
            >{{ line.round.bestState ?? '' }}</span
          >
          <span class="col-start-2 col-end-4 text-[0.88rem] text-text-muted">{{
            line.detail
          }}</span>
        </a>
      </li>
    }
  </ul>
} @else {
  <p class="bg-text-primary/4 px-4 py-6 text-center text-text-muted">
    Aucun round avec ces filtres.
  </p>
}

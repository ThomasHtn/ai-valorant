<div class="flex flex-col gap-3">
  <div class="flex flex-wrap items-center gap-x-4 gap-y-2.5">
    <app-map-picker [maps]="maps()" [selected]="mapName()" />
    <label class="ml-auto flex items-center gap-2">
      <span class="text-[0.85rem] text-text-muted">Joueur</span>
      <select id="minimap-player" class="field-control" (change)="setPlayer($event)">
        <option value="" [selected]="!state.filters().player">Toute l'escouade</option>
        @for (player of players(); track player) {
          <option [value]="player" [selected]="state.filters().player === player">
            {{ player }}
          </option>
        }
      </select>
    </label>
    <div class="inline-flex border border-edge-strong" role="group" aria-label="Side">
      @for (option of sides; track option) {
        <button
          type="button"
          class="focus-ring h-9 cursor-pointer px-3.5 font-semibold transition-colors"
          [class]="
            option === side()
              ? 'bg-brand-500 text-surface-sunken'
              : 'text-text-secondary hover:bg-text-primary/7 hover:text-text-primary'
          "
          [class.border-l]="!$first"
          [class.border-edge-strong]="!$first"
          [attr.aria-pressed]="option === side()"
          (click)="side.set(option)"
        >
          {{ sideLabels[option] }}
        </button>
      }
    </div>
  </div>

  <app-resource-state
    [resource]="view"
    notFoundText="Pas de données pour cette carte sur cette période."
  >
    @if (view.hasValue()) {
      @let data = view.value();
      <div class="grid items-start gap-4 xl:grid-cols-[14.5rem_minmax(0,540px)_minmax(0,1fr)]">
        <div class="flex flex-col gap-2">
          <app-layer-toggles
            [active]="layers()"
            [counts]="counts()"
            (toggle)="toggleLayer($event)"
          />
          <p class="!m-0 text-[0.92rem] text-text-muted">
            {{ sideData()?.layers?.rounds ?? 0 }} rounds en {{ sideLabel() }}. Clic sur un point :
            le round.
            @if (state.filters().player; as player) {
              Points de {{ player }} en avant.
            }
          </p>
        </div>
        <app-minimap-canvas
          [map]="data.mapName"
          [markers]="markers()"
          [labels]="data.callouts"
          [highlight]="highlight()"
        />
        @if (zones(); as z) {
          <app-zone-table
            [map]="data.mapName"
            [sideLabel]="sideLabel()"
            [rows]="z.rows"
            [squadFirstDeaths]="z.firstDeaths"
            [topFirstDeaths]="z.topFirstDeaths"
            (highlight)="setHighlight($event)"
          />
        }
      </div>
    }
  </app-resource-state>
</div>

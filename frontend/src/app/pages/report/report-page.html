<app-page-header>
  <app-period-switcher />
  <app-reference-chip />
  <app-report-tabs appHeaderTabs />
</app-page-header>

<div class="page-body !pt-6">
  <app-resource-state
    class="block"
    [resource]="context.meta"
    notFoundText="Aucun match de l'escouade sur cette période."
  >
    @if (opening()) {
      <p class="flex items-center gap-3 py-8" role="status">
        <span class="loader-hex clip-hex" aria-hidden="true"></span>
        <span class="text-sm text-text-muted">Chargement…</span>
      </p>
    }
    <router-outlet />
  </app-resource-state>
</div>

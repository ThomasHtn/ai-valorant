@for (session of sessions(); track session.day) {
  <section class="view-section" [attr.aria-labelledby]="'session-' + session.day">
    <h2 [id]="'session-' + session.day">
      {{ session.title }}
      <app-badge [label]="session.record" [kind]="session.good ? 'good' : 'bad'" size="sm" />
      <span class="order-2 font-sans text-sm font-normal text-text-muted">{{ session.count }}</span>
    </h2>
    <ol class="m-0 flex list-none flex-col gap-0.5 p-0">
      @for (row of session.rows; track row.matchId) {
        <li><app-match-row [match]="row" /></li>
      }
    </ol>
  </section>
} @empty {
  <p class="text-text-muted">Aucune session sur cette période.</p>
}

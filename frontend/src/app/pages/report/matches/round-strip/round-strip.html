<div class="flex flex-wrap gap-0.5">
  @for (item of items(); track item.key) {
    @if (item.cell; as cell) {
      <a
        [routerLink]="item.link"
        queryParamsHandling="preserve"
        [appHoverTip]="item.tip"
        class="focus-ring-inset flex min-h-14 w-10.5 flex-col items-center justify-between py-1 !text-text-primary no-underline hover:outline hover:-outline-offset-1 hover:outline-edge-strong"
        [class]="cell.won ? 'tone-good' : 'tone-bad'"
        [attr.aria-label]="'Round ' + cell.roundNumber + ', ' + (cell.won ? 'gagné' : 'perdu')"
      >
        <span class="font-display text-base leading-none font-semibold">{{
          cell.roundNumber
        }}</span>
        <span class="text-[0.72rem] leading-none text-text-secondary">{{
          cell.side === 'att' ? 'Att' : 'Déf'
        }}</span>
        <span class="text-[0.72rem] leading-none font-semibold">{{ item.buy }}</span>
      </a>
    } @else {
      <span class="w-2.5" aria-hidden="true"></span>
    }
  }
</div>

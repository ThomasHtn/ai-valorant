<h2 class="!m-0 text-lg">Déroulé</h2>
<!-- Column names over the lines, on the same grid. -->
<div
  class="grid grid-cols-[2.6rem_3.6rem_minmax(0,1fr)_6.5rem_3.5rem] gap-2.5 border-l-[3px] border-transparent px-2.5 text-sm text-text-muted"
  aria-hidden="true"
>
  <span>Temps</span>
  <span></span>
  <span>Action</span>
  <span class="text-right">Chances</span>
  <span class="text-right">En vie</span>
</div>
<ol class="m-0 flex list-none flex-col gap-0.5 p-0">
  @for (line of lines(); track line.index) {
    @let active = line.index === step();
    @let key = line.index === keyStep();
    <li>
      <button
        type="button"
        class="focus-ring-inset grid w-full cursor-pointer grid-cols-[2.6rem_3.6rem_minmax(0,1fr)_6.5rem_3.5rem] items-center gap-2.5 border-l-[3px] px-2.5 py-1.5 text-left transition-colors hover:bg-text-primary/10"
        [class]="
          active ? 'border-brand-500 bg-text-primary/7' : 'border-transparent bg-text-primary/4'
        "
        [attr.aria-current]="active"
        (click)="stepChange.emit(line.index)"
      >
        <span class="text-text-secondary tabular-nums">{{ line.time }}</span>
        <span class="px-1 py-0.5 text-center text-xs font-semibold" [class]="line.tag.className">{{
          line.tag.label
        }}</span>
        <span
          >{{ line.text }}
          @if (key) {
            <b class="ml-2 text-sm whitespace-nowrap text-brand-400">moment clé</b>
          }
        </span>
        <span
          class="text-right text-sm whitespace-nowrap tabular-nums"
          [class]="line.chance.className"
          [class.font-semibold]="key"
          [appHoverTip]="line.chanceTip"
          >{{ line.chance.label }}</span
        >
        <b class="text-right font-display font-semibold" [appHoverTip]="line.stateTip">{{
          line.state
        }}</b>
      </button>
    </li>
  }
</ol>

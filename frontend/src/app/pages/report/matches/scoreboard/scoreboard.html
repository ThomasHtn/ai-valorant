<div class="overflow-x-auto">
  <table class="hover-rows w-full border-separate border-spacing-y-0.5 tabular-nums">
    <thead>
      <tr>
        <th
          scope="col"
          class="bg-text-primary/8 px-2 py-1.5 text-left text-sm font-semibold text-text-secondary"
        >
          {{ title() }}
        </th>
        @for (column of columns; track column.key) {
          <th
            scope="col"
            class="bg-text-primary/8 px-2 py-1.5 text-right text-sm font-semibold whitespace-nowrap text-text-secondary"
          >
            {{ column.label }}<app-info-tip [topic]="column.help" />
          </th>
        }
      </tr>
    </thead>
    <tbody>
      @for (line of lines(); track line.name; let first = $first) {
        <tr [class.shadow-[inset_0_-1px_0_var(--color-brand-500)]]="first">
          <td class="min-w-40 bg-text-primary/4 px-2 py-1 text-sm">
            <div class="flex items-center gap-2">
              <app-agent-icon [agent]="line.agent" />
              <span
                class="truncate"
                [class]="squad() ? 'text-text-primary' : 'text-text-secondary'"
                >{{ line.name }}</span
              >
              <app-rank-icon class="ml-auto text-text-muted" [name]="line.rank" />
            </div>
          </td>
          @for (column of columns; track column.key) {
            <td class="bg-text-primary/4 px-2 py-1 text-right text-sm">
              {{ format(line[column.key], column.format) }}
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
</div>

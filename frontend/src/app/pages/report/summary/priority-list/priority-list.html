<ul class="!m-0 flex list-none flex-col gap-0.5 !p-0">
  @for (item of rows(); track item.key) {
    <li>
      <!-- One line per subject; the details open with its card in Points forts et faibles. -->
      <a
        routerLink="/report/findings"
        [queryParams]="{ open: side() + ':' + item.key }"
        queryParamsHandling="merge"
        class="row-link grid grid-cols-[2rem_minmax(0,1fr)_auto] items-center gap-x-3 border-l-[3px] border-transparent bg-text-primary/4 py-2 pr-2 pl-2.5"
        [title]="item.metric + ' : ' + item.detail"
      >
        <app-row-art class="!size-8" [art]="item.art" />
        <span class="flex min-w-0 flex-col leading-tight">
          <span class="flex min-w-0 items-center gap-2">
            <b class="truncate font-display text-[1.0625rem] font-semibold">{{ item.scope }}</b>
            <app-badge
              [label]="item.status"
              [kind]="item.confirmed ? 'confirmed' : 'lead'"
              size="sm"
            />
          </span>
          <span class="truncate text-sm text-text-secondary">{{ item.metric }}</span>
        </span>
        <app-gap-chip [value]="item.gap" [unit]="item.unit" [tone]="weak() ? 'bad' : 'good'" />
      </a>
    </li>
  } @empty {
    <li class="bg-text-primary/4 px-4 py-5 text-center text-text-muted">
      Aucun écart sur cette période.
    </li>
  }
</ul>

<ul class="!m-0 flex list-none flex-col gap-0.5 !p-0">
  @for (item of rows(); track item.key) {
    <li>
      <!-- One line per subject; the details open with its card in Points forts et faibles. -->
      <a
        routerLink="/report/findings"
        [queryParams]="{ open: side() + ':' + item.key }"
        queryParamsHandling="merge"
        class="row-link grid grid-cols-[2.25rem_minmax(0,1fr)_auto] items-center gap-x-3.5 border-l-[3px] border-transparent bg-text-primary/4 py-2.5 pr-3 pl-2.5"
      >
        @if (item.art) {
          <app-row-art class="!size-9" [art]="item.art" />
        } @else {
          <!-- Findings about the whole squad (Global, Pistol, Force buy) get the squad icon. -->
          <span class="grid size-9 place-items-center bg-text-primary/8 text-text-secondary">
            <svg lucideUsers class="size-5" aria-hidden="true"></svg>
          </span>
        }
        <span class="flex min-w-0 flex-col gap-0.5 leading-tight">
          <span class="flex min-w-0 items-center gap-2">
            <b class="truncate font-display text-[1.0625rem] font-semibold">{{ item.scope }}</b>
            <app-badge
              [label]="item.status"
              [kind]="item.confirmed ? 'confirmed' : 'lead'"
              size="sm"
            />
          </span>
          <span class="truncate text-[0.95rem] text-text-secondary"
            >{{ item.metric }} : {{ item.detail }}</span
          >
          <!-- Rounds at stake on the scale of the biggest gap of the Résumé. -->
          <span class="relative mt-1 h-1.5 bg-text-primary/8" aria-hidden="true">
            <i
              class="absolute inset-y-0 left-0 block"
              [class]="weak() ? 'bg-rating-bad' : 'bg-rating-good'"
              [style.width.%]="item.width"
            ></i>
          </span>
        </span>
        <app-rounds-gap class="min-w-[8.5rem]" [gap]="item.gapRounds" [matches]="item.matches" />
      </a>
    </li>
  } @empty {
    <li class="bg-text-primary/4 px-4 py-5 text-center text-text-muted">
      Aucun écart sur cette période.
    </li>
  }
</ul>

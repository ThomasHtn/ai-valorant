<ul class="!m-0 flex list-none flex-col gap-0.5 !p-0">
  @for (item of rows(); track item.key) {
    <li
      class="grid grid-cols-[2rem_minmax(0,1fr)_auto] items-center gap-x-3 gap-y-1.5 bg-text-primary/4 px-3 py-2.5"
    >
      <app-row-art class="!size-8" [art]="item.art" />
      <div class="flex min-w-0 flex-col">
        <span class="flex flex-wrap items-center gap-x-2 gap-y-0.5">
          <span class="font-semibold">{{ item.scope }}</span>
          <app-badge
            [label]="item.status"
            [kind]="item.confirmed ? 'confirmed' : 'lead'"
            size="sm"
          />
        </span>
        <span class="text-text-secondary"
          >{{ item.metric }} <span class="text-text-muted">{{ item.detail }}</span></span
        >
      </div>
      <p
        class="!m-0 text-right font-display text-xl leading-tight font-semibold tabular-nums"
        [class]="weak() ? 'text-rating-bad' : 'text-rating-good'"
      >
        {{ item.gap }}
        <span class="block font-sans text-xs font-normal text-text-muted">rounds</span>
      </p>
      @if (item.rewatch.length) {
        <app-rewatch-links
          class="col-span-2 col-start-2"
          [rounds]="item.rewatch"
          [max]="rewatchMax"
          label="À revoir :"
        />
      }
    </li>
  } @empty {
    <li class="bg-text-primary/4 px-4 py-5 text-center text-text-muted">
      Aucun écart sur cette période.
    </li>
  }
</ul>

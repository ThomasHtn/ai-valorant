<table class="data-table">
  <tr>
    <th>Statistique</th>
    <th class="num">{{ name() }}</th>
    <th class="num">Adversaires (même niveau) <app-info-tip topic="opponents" /></th>
    <th class="num">Top ranked (mêmes agents) <app-info-tip topic="topRanked" /></th>
  </tr>
  @for (stat of stats(); track stat.key) {
    <tr>
      <td>
        {{ definitions().get(stat.key)?.label ?? stat.key }}
        <app-info-tip [content]="helps().get(stat.key) ?? null" />
      </td>
      <td class="num font-semibold" [class]="toneClass(stat.versusOpponents)">
        {{ format(stat.key, stat.value) }}
      </td>
      <td class="num">{{ format(stat.key, stat.opponents) }}</td>
      <td class="num">
        {{ format(stat.key, stat.top) }}
        <span [class.good]="stat.versusTop === 'good'" [class.bad]="stat.versusTop === 'bad'">{{
          arrow(stat)
        }}</span>
      </td>
    </tr>
  }
</table>

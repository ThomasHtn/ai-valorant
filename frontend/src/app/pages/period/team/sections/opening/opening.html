@let o = opening();
<app-gap-list class="max-w-4xl" [lines]="sideLines()" />

@if (o.duelMaps.length) {
  <details class="my-2">
    <summary class="cursor-pointer text-brand-400">
      Voir où se jouent vos premiers duels ({{ o.duelMaps.length }} cartes)
    </summary>
    <app-duel-map-legend />
    <div class="grid grid-cols-[repeat(auto-fill,minmax(240px,1fr))] gap-3">
      @for (duels of o.duelMaps; track $index) {
        <figure>
          <app-duel-map [duels]="duels" />
          <figcaption class="caption">
            <strong
              >{{ duels.mapName
              }}{{ duels.side ? ', ' + sideLabels[duels.side].toLowerCase() : '' }}</strong
            >
            : {{ duels.won.length }} FB, {{ duels.lost.length }} FD
          </figcaption>
        </figure>
      }
    </div>
  </details>
}

<div class="columns mt-6">
  <div>
    <h3 class="!mt-0">Premiers duels de chaque joueur</h3>
    <app-gap-list labelHeader="Joueur" [lines]="playerDuels()" />
  </div>
  <div>
    <h3 class="!mt-0">Rounds gagnés après sa first death <app-info-tip topic="recover" /></h3>
    <app-gap-list labelHeader="Joueur" [lines]="playerRecovers()" />
  </div>
</div>

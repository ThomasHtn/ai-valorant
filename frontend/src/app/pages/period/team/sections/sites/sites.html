<!-- Two questions a coach asks of each site: do we win after our plant, and do we win theirs back? -->
<div class="columns">
  <div>
    <h3 class="!mt-0">En attaque : rounds gagnés après votre plant</h3>
    <app-gap-list
      labelHeader="Site"
      [lines]="postPlants()"
      empty="Aucun plant sur cette période."
    />
    <h3>Selon le moment du plant <app-info-tip topic="plantTempo" /></h3>
    <app-gap-list labelHeader="Moment" [lines]="tempo()" />
    <h3>Selon les joueurs en vie au plant <app-info-tip topic="numbersAtPlant" /></h3>
    <app-gap-list labelHeader="Vous par rapport à eux" [lines]="attackNumbers()" />
  </div>
  <div>
    <h3 class="!mt-0">En défense : retakes gagnés après leur plant</h3>
    <app-gap-list
      labelHeader="Site"
      [lines]="retakes()"
      empty="Aucun plant adverse sur cette période."
    />
    <h3>Selon les joueurs en vie au plant <app-info-tip topic="numbersAtPlant" /></h3>
    <app-gap-list labelHeader="Vous par rapport à eux" [lines]="defenseNumbers()" />
  </div>
</div>

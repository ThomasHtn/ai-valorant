<header class="border-b border-edge bg-surface-sunken">
  <div class="app-header-inner flex h-14 items-center gap-x-3 sm:gap-x-4">
    <a
      routerLink="/"
      class="focus-ring flex shrink-0 items-center font-display text-lg leading-none font-bold uppercase no-underline"
      aria-label="ValoStats, dernier rapport"
    >
      <span class="text-brand-500">Valo</span><span class="text-text-primary">Stats</span>
    </a>
    <!-- Scope separator, as in a breadcrumb: what follows is what the page is about. -->
    <svg class="h-6 w-3 shrink-0 text-edge-strong" viewBox="0 0 12 24" aria-hidden="true">
      <path d="M10 2 2 22" stroke="currentColor" stroke-width="1.5" fill="none" />
    </svg>
    <ng-content />
  </div>
  <ng-content select="[appHeaderTabs]" />
</header>

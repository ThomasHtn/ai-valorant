<!-- Context bar of a page, as in ValoQuests: sunken, an amber rule under it, the page title in
     display capitals, and whatever the page offers from its chrome on the right. -->
<header class="border-b border-brand-500/50 bg-surface-sunken">
  <div class="mx-auto flex min-h-16 w-full items-center gap-3 px-4 sm:gap-4 sm:px-6">
    <button
      #menuButton
      type="button"
      class="focus-ring -ml-2 flex h-11 w-11 shrink-0 cursor-pointer items-center justify-center text-text-primary transition-colors hover:bg-brand-500/8 lg:hidden"
      [attr.aria-controls]="nav.panelId"
      [attr.aria-expanded]="nav.isOpen()"
      aria-label="Ouvrir le menu"
      (click)="nav.open(menuButton)"
    >
      <svg class="block h-6 w-6 shrink-0" lucideMenu></svg>
    </button>

    <div class="flex min-w-0 flex-1 items-center">
      @if (heading()) {
        <h1
          class="truncate font-display text-xl leading-tight font-bold tracking-wide text-brand-500 uppercase sm:text-2xl"
        >
          {{ heading() }}
        </h1>
      }
      <!-- A page may bring its own title, such as the period picker. -->
      <ng-content select="[pageTitle]" />
    </div>

    <div class="flex min-w-0 shrink items-center gap-2">
      <ng-content />
    </div>
  </div>
</header>

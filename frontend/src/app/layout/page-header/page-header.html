<!-- Context bar of a page, as in ValoQuests: sunken, an amber rule under it, the wordmark home link,
     the page title in display capitals, the page's own tabs resting on the rule, then what the page
     offers on the right. -->
<header class="border-b border-brand-500/50 bg-surface-sunken">
  <div class="mx-auto flex min-h-16 w-full flex-wrap items-stretch gap-x-6 px-4 sm:px-6">
    <div class="flex min-w-0 items-center gap-4 py-3">
      <a
        routerLink="/"
        class="focus-ring flex shrink-0 items-center border-r border-edge pr-4 font-display text-xl leading-tight font-bold uppercase no-underline"
        aria-label="ValoStats, accueil"
      >
        <span class="text-brand-500">Valo</span>
        <span class="text-text-primary">Stats</span>
      </a>
      @if (heading()) {
        <h1
          class="truncate font-display text-xl leading-tight font-bold tracking-wide text-brand-500 uppercase sm:text-2xl"
        >
          {{ heading() }}
        </h1>
      }
      <!-- A page may bring its own title, such as the period picker. -->
      <ng-content select="[pageTitle]" />
    </div>

    <!-- Wraps under the title on a phone. -->
    <ng-content select="[pageTabs]" />

    <div class="ml-auto flex min-w-0 shrink items-center gap-2">
      <ng-content />
    </div>
  </div>
</header>

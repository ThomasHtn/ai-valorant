<a
  class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:border focus:border-brand-500/45 focus:bg-surface-800 focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-text-primary"
  href="#main-content"
  (click)="skipToContent($event)"
>
  Aller au contenu
</a>

<!-- Each page scrolls its own body (`page-body`), so the page's context bar never moves. -->
<div class="ambient-field h-dvh overflow-hidden bg-surface-950">
  <main #main id="main-content" class="relative h-full overflow-hidden" tabindex="-1">
    <router-outlet />
  </main>
</div>

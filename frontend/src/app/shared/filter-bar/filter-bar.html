<div
  class="flex flex-wrap items-end gap-x-4 gap-y-3 bg-text-primary/4 px-4 py-3"
  role="group"
  aria-label="Filtres"
>
  @if (showMap()) {
    <label class="flex min-w-0 flex-col gap-1">
      <span class="text-sm text-text-muted">Carte</span>
      <select
        class="field-control min-w-32"
        [value]="state.filters().map"
        (change)="setMap($event)"
      >
        <option value="">Toutes</option>
        @for (map of maps(); track map) {
          <option [value]="map">{{ map }}</option>
        }
      </select>
    </label>
  }
  @if (showSide()) {
    <label class="flex min-w-0 flex-col gap-1">
      <span class="text-sm text-text-muted">Side</span>
      <select
        class="field-control min-w-32"
        [value]="state.filters().side"
        (change)="setSide($event)"
      >
        @for (option of sideOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </label>
  }
  @if (showPlayer()) {
    <label class="flex min-w-0 flex-col gap-1">
      <span class="text-sm text-text-muted">Joueur</span>
      <select
        class="field-control min-w-32"
        [value]="state.filters().player"
        (change)="setPlayer($event)"
      >
        <option value="">Toute l'escouade</option>
        @for (player of players(); track player) {
          <option [value]="player">{{ player }}</option>
        }
      </select>
    </label>
  }
  @if (showReference()) {
    <div class="flex flex-col gap-1">
      <span class="text-sm text-text-muted">Référence<app-info-tip topic="reference" /></span>
      <div class="inline-flex border border-edge-strong" role="group" aria-label="Référence">
        @for (option of referenceOptions; track option.value) {
          @let active = state.preferences().reference === option.value;
          <button
            type="button"
            class="focus-ring h-[2.15rem] cursor-pointer px-3 font-semibold transition-colors not-first:border-l not-first:border-edge-strong"
            [class]="
              active
                ? 'bg-brand-500 text-surface-sunken'
                : 'text-text-secondary hover:bg-text-primary/7 hover:text-text-primary'
            "
            [attr.aria-pressed]="active"
            (click)="setReference(option.value)"
          >
            {{ option.label }}
          </button>
        }
      </div>
    </div>
  }
  <span class="flex-1"></span>
  @if (showToggles()) {
    @for (toggle of toggles; track toggle.key) {
      <label class="inline-flex h-9 cursor-pointer items-center gap-2 text-text-secondary">
        <input
          type="checkbox"
          class="size-4 accent-brand-500"
          [checked]="state.preferences()[toggle.key]"
          (change)="state.toggle(toggle.key)"
        />
        {{ toggle.label }}
      </label>
    }
  }
</div>

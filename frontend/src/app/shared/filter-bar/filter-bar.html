<!-- One compact row: each label sits left of its control so the bar costs a single line. -->
<div class="filter-strip" role="group" aria-label="Filtres">
  @if (showMap()) {
    <label class="flex min-w-0 items-center gap-2">
      <span class="filter-label">Carte</span>
      <!-- [selected] on options, not [value] on the select: options can arrive after the value. -->
      <select class="field-control min-w-28" (change)="setMap($event)">
        <option value="" [selected]="!state.filters().map">Toutes</option>
        @for (map of maps(); track map) {
          <option [value]="map" [selected]="state.filters().map === map">{{ map }}</option>
        }
      </select>
    </label>
  }
  @if (showSide()) {
    <label class="flex min-w-0 items-center gap-2">
      <span class="filter-label">Side</span>
      <select class="field-control min-w-28" (change)="setSide($event)">
        @for (option of sideOptions; track option.value) {
          <option [value]="option.value" [selected]="state.filters().side === option.value">
            {{ option.label }}
          </option>
        }
      </select>
    </label>
  }
  @if (showPlayer()) {
    <label class="flex min-w-0 items-center gap-2">
      <span class="filter-label">Joueur</span>
      <select class="field-control min-w-28" (change)="setPlayer($event)">
        <option value="" [selected]="!state.filters().player">Toute l'escouade</option>
        @for (player of players(); track player) {
          <option [value]="player" [selected]="state.filters().player === player">
            {{ player }}
          </option>
        }
      </select>
    </label>
  }
  <!-- Controls a view adds to the bar (a view-only filter, a mode switch). -->
  <ng-content />
  @if (state.filtered()) {
    <button
      type="button"
      class="focus-ring ml-auto cursor-pointer text-sm text-brand-400 hover:text-brand-300 hover:underline"
      (click)="state.resetFilters()"
    >
      Effacer les filtres
    </button>
  }
</div>

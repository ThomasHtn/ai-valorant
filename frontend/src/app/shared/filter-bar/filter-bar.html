<!-- One compact row: each label sits left of its control so the bar costs a single line. -->
<div class="filter-strip" role="group" aria-label="Filtres">
  @if (showMap()) {
    <label class="flex min-w-0 items-center gap-2">
      <span class="filter-label">Carte</span>
      <select
        class="field-control min-w-28"
        [value]="state.filters().map"
        (change)="setMap($event)"
      >
        <option value="">Toutes</option>
        @for (map of maps(); track map) {
          <option [value]="map">{{ map }}</option>
        }
      </select>
    </label>
  }
  @if (showSide()) {
    <label class="flex min-w-0 items-center gap-2">
      <span class="filter-label">Side</span>
      <select
        class="field-control min-w-28"
        [value]="state.filters().side"
        (change)="setSide($event)"
      >
        @for (option of sideOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </label>
  }
  @if (showPlayer()) {
    <label class="flex min-w-0 items-center gap-2">
      <span class="filter-label">Joueur</span>
      <select
        class="field-control min-w-28"
        [value]="state.filters().player"
        (change)="setPlayer($event)"
      >
        <option value="">Toute l'escouade</option>
        @for (player of players(); track player) {
          <option [value]="player">{{ player }}</option>
        }
      </select>
    </label>
  }
  @if (showReference()) {
    <div class="flex items-center gap-2">
      <span class="filter-label">Référence<app-info-tip topic="reference" /></span>
      <div class="seg-group" role="group" aria-label="Référence">
        @for (option of referenceOptions; track option.value) {
          <button
            type="button"
            class="seg-option"
            [attr.aria-pressed]="state.preferences().reference === option.value"
            (click)="setReference(option.value)"
          >
            {{ option.label }}
          </button>
        }
      </div>
    </div>
  }
  <!-- Controls a view adds to the bar (a view-only filter, a mode switch). -->
  <ng-content />
  @if (showToggles()) {
    <app-display-toggles class="ml-auto" />
  }
</div>

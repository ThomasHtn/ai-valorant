server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;

	# Traefik terminates HTTPS in front of this container, so HSTS belongs there, not here.
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	# Bundles and stylesheets carry a content hash ("outputHashing": "all"), so a URL never changes.
	# add_header in a location replaces the server ones, hence the repetition.
	location ~* \.(?:js|css|woff2)$ {
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
	}

	# Game pictures from public/ are not hashed: cached, but refreshed within the day after a patch.
	location ~* \.(?:svg|webp|png|ico)$ {
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Cache-Control "public, max-age=3600" always;
	}

	# Angular SPA: unknown paths fall back to index.html. $uri/ is left out so asset folders
	# never shadow a route.
	location / {
		# The shell names the hashed bundles; caching it would pin clients to a stale deployment.
		add_header Cache-Control "no-cache" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;

		try_files $uri /index.html;
	}
}
